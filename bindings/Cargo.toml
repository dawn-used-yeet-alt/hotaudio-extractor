[workspace]
resolver = "2"
members = ["hotaudio-ffi", "uniffi-bindgen"]

# Kept out of the root package's workspace on purpose. The root crate is the
# protocol implementation and is held to a permissive-only dependency policy; a
# binding generator is a separate concern with its own (MPL-2.0) dependency
# tree, its own release cadence and its own CI. See `docs/BINDINGS.md`.
#
# The bindings track stable Rust rather than the core's 1.85 floor: UniFFI's
# codegen is a build-time tool, not code that ships inside the library.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dawn-used-yeet-alt/hotaudio-extractor"
publish = false

[workspace.dependencies]
uniffi = "0.32"
thiserror = "2"

# Same bar as the core crate: `pedantic`, with the wire-format cast exemptions
# the pipelines already rely on. Applied to both members, including the
# generator's thin `main`.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[profile.release]
# The core's release profile strips. A shipped AAR, XCFramework or wheel needs
# native debug symbols for crash reports, so the binding artifacts keep theirs.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false
