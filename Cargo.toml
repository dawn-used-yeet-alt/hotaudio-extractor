[package]
name = "hotaudio-rs"
version = "1.2.2"
edition = "2024"
# Also the floor for the dependency tree: several RustCrypto and ureq crates
# declare the same MSRV. CI checks against this version.
rust-version = "1.87"
description = "hotaudio.net audio extractor: page handshake, VM-based request signing, X25519 listen key exchange, HAX0 decrypt."
license = "MIT"
readme = "README.md"
repository = "https://github.com/dawn-used-yeet-alt/hotaudio-extractor"
keywords = ["hotaudio", "audio", "extractor", "download", "x25519", "chacha20poly1305"]
categories = ["command-line-utilities", "cryptography", "wasm"]
# No application dependencies: the signer is a native port of the player's
# signature VM, so nothing is evaluated at runtime. Distribution is via GitHub
# release binaries (see .github/workflows/release.yml).
publish = false

[lib]
name = "hotaudio"
path = "src/lib.rs"
# `cdylib` so `wasm-bindgen` can consume the same sources as an rlib; it costs
# nothing native beyond a second link of a small library.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "hotaudio-download"
path = "src/bin/download.rs"
# The CLI's dependencies (`clap`, `clap_complete`, `clap_mangen`, `ctrlc`) are
# behind this feature, so a library consumer — the FFI bindings in particular —
# can depend on the crate without resolving a parser or a signal handler.
# Default on, because the binary is the primary deliverable and `cargo run`
# should keep working; binding builds opt out with `default-features = false`.
required-features = ["cli"]

[features]
default = ["cli"]
# The binary. Its dependencies are optional, so they leave the library graph.
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:ctrlc"]
# Route diagnostics through the `log` facade instead of stderr/console. Off by
# default so the CLI and the browser keep their zero-configuration behaviour;
# the FFI crate enables it and installs the host's logger.
log = ["dep:log"]

[dependencies]
# Diagnostics, only when the `log` feature is on. The facade has no logger of
# its own: a host that enables the feature is expected to install one.
log = { version = "0.4", optional = true }
# Crypto — RustCrypto. On x86-64 these dispatch to AES-NI/SHA-NI/AVX2 at runtime;
# on wasm32 there is no SIMD dispatch, so they take the portable path.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "precomputed-tables", "getrandom"] }
hex = "0.4"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native transport: blocking HTTP with rustls + connection pooling. Keeps the
# whole tool single-threaded; the pipeline is latency-bound, not CPU-bound.
# wasm32 has no blocking sockets, so it uses the fetch transport instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
# Ctrl-C for the CLI. Pinned exactly: 3.5.1+ pulls `nix 0.31`, which pins a
# `libc` older than the rest of the tree and would duplicate it; 3.5.0 stays on
# `nix ^0.30` and reuses the `windows-sys 0.61` already in the graph.
ctrlc = { version = "=3.5.2", optional = true }

# CLI parsing, `--help` and the generated completions and man page. Not the
# library, and not `wasm32`: there is no argv there, and clap supports that
# target only "best effort" (no CI), which the required green wasm build cannot
# rest on. See the `Cli` type in `src/bin/download.rs`.
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.3", optional = true }

# Browser transport. `getrandom/wasm_js` is what gives `EphemeralSecret::random`
# a CSPRNG: the `wasm32-unknown-unknown` target has no default backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "BinaryType",
    "Headers",
    "Performance",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
    "WorkerGlobalScope",
    "console",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Strict lints for the whole crate, on both targets. `priority = -1` lets an
# individual `#[allow]` override the group without also having to disable it in
# every invocation; CI still turns warnings into errors.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }

# The signer is a port of a JavaScript VM, and the parsers read wire formats
# whose fields are defined as wrapping, truncating or IEEE-754 values. These
# conversions are deliberate at the point they appear, and every one is bounded
# by a format or length check; rewriting them as `try_from` would add branches
# to the decrypt path without making the bound any stronger. `cast_lossless`
# stays denied, because those conversions lose nothing and read better as
# `From`.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"