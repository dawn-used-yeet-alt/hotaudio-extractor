name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The installed toolchain is newer than the MSRV, so a bare `cargo`
      # invocation cannot catch accidental use of features gated after 1.85.
      # Several dependencies also declare 1.85 as their own MSRV, so this is
      # the floor for the tree, not just for this crate.
      - name: Check MSRV
        run: |
          rustup toolchain install 1.85 --profile minimal
          cargo +1.85 check --locked --all-targets
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # Catches broken intra-doc links and undocumented public items, which
      # otherwise only surface for someone reading the published docs.
      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The release ships shell completions and a man page generated by the
      # binary itself (see release.yml), so the generator is exercised here
      # rather than first at tag time. The unit tests already assert the
      # content; this only proves the shipped entry points still run.
      - name: Completions and man page
        run: |
          set -euo pipefail
          for shell in bash zsh fish powershell; do
            cargo run --locked --quiet -- --completions "$shell" > "completions.$shell"
            test -s "completions.$shell"
          done
          cargo run --locked --quiet -- --man-page > hotaudio-download.1
          test -s hotaudio-download.1
      # The decrypt path is the crate's performance claim, and the wasm
      # transport work could have pushed a copy or an await into it without any
      # test failing. The timing assertion only exists in optimised builds, and
      # its floor is calibrated for the CI runner, so it stays on the reference
      # platform rather than in the cross-platform test matrix below.
      - name: Perf guard
        run: cargo test --release --locked --test perf_guard

  # Supply-chain gate over the same target set that ships (`deny.toml`):
  # advisories, license expressions, banned crates and allowed sources. Unlike
  # `cargo test` this needs network — it fetches the RustSec advisory database.
  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Prebuilt binary, so cargo-deny's own tree is not compiled here. Pinned
      # because `deny.toml` is tied to a cargo-deny schema version.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Check advisories, licenses, bans and sources
        run: cargo deny check

  # Attribution: the copyright notices and license texts of everything linked
  # into the binaries have to travel with them. The release workflow generates
  # that notice from the tag's locked graph (see release.yml); there is nothing
  # to keep in sync. This job only proves the generator still works on the
  # current tree, so a broken tool fails here rather than at release time.
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Not carried by `install-action`, and the release asset publishes no
      # checksum, so the digest is pinned here to make the download verifiable.
      - name: Install cargo-bundle-licenses
        run: |
          set -euo pipefail
          url=https://github.com/sstadick/cargo-bundle-licenses/releases/download/v4.2.0/cargo-bundle-licenses-linux-amd64
          bin="$HOME/.cargo/bin/cargo-bundle-licenses"
          curl -fsSL "$url" -o "$bin"
          echo "4208af8db7a34b427068211e73cdd299b577245601f68c5a1c3af85e4fa4cc7c  $bin" | sha256sum -c -
          chmod +x "$bin"
      # The tool reads license files from the crate sources, which
      # `cargo metadata` alone does not download.
      - name: Fetch crate sources
        run: cargo fetch --locked
      - name: Generate the third-party notice
        run: cargo bundle-licenses --format yaml --output "$RUNNER_TEMP/THIRD_PARTY_LICENSES.yml"
      - name: Check the notice is complete
        run: |
          set -euo pipefail
          notice="$RUNNER_TEMP/THIRD_PARTY_LICENSES.yml"
          test -s "$notice"
          # Spot-check a few crates that must be attributed, so a generator that
          # silently emits nothing cannot pass.
          for crate in ureq rustls chacha20poly1305 x25519-dalek; do
            grep -q "package_name: ${crate}$" "$notice" \
              || { echo "::error::$crate missing from the third-party notice"; exit 1; }
          done

  # The crate ships natively on Windows and macOS. `sanitize`, the
  # `--stream-to` temp-file rename and path handling differ per platform, and
  # the ubuntu-only gates above cannot see a bug that only appears there. Run
  # the offline suite on every shipped desktop target; the MSRV, fmt, clippy
  # and doc gates stay single-platform because they are host-independent.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  # The browser build is the same pipeline over the `fetch` transport, so it is
  # held to the same bar: clippy-clean, and the same tests actually executed in
  # a browser rather than merely compiled.
  wasm:
    name: wasm (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Same reasoning as the MSRV check above: the installed toolchain is newer
      # than the floor, so a bare `cargo` cannot catch a feature gated after 1.85.
      - name: Check MSRV
        run: |
          # The target must be added to the 1.85 toolchain specifically. The
          # `dtolnay/rust-toolchain` step above installs it for `stable`, which
          # is a separate toolchain, and `+1.85` does not inherit it.
          rustup toolchain install 1.85 --profile minimal --target wasm32-unknown-unknown
          cargo +1.85 check --locked --target wasm32-unknown-unknown --lib
      - name: Clippy
        run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
      # The runner is not on the image and `cargo install` would rebuild the
      # whole tree. The CLI version must match the `wasm-bindgen` in Cargo.lock
      # exactly: the runner rejects a test binary produced by a different one.
      - uses: taiki-e/install-action@wasm-bindgen-cli
        with:
          version: 0.2.129
      # `wasm32-unknown-unknown` binaries cannot be exec'd; this runner executes
      # them through `wasm-bindgen`, which is what a page does.
      - name: Test
        run: cargo test --locked --target wasm32-unknown-unknown
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  # The other half of the crate is the browser build. This runs the exact script
  # the release uses, so a change that breaks the `pkg/` package fails here,
  # before a tag exists, rather than during one.
  wasm-pkg:
    name: wasm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # With no explicit version the action installs the `wasm-bindgen` from
      # Cargo.lock, which is the version the build script insists on.
      - uses: taiki-e/install-action@wasm-bindgen-cli
      - name: Build the package
        run: ./scripts/build-wasm.sh
      - name: Check the package
        run: |
          set -euo pipefail
          for f in web/hotaudio.js web/hotaudio.d.ts web/hotaudio_bg.wasm \
                   nodejs/hotaudio.js nodejs/hotaudio.d.ts nodejs/hotaudio_bg.wasm; do
            test -s "pkg/$f" || { echo "::error::missing pkg/$f"; exit 1; }
          done
          # The generated types have to describe the exports, not merely exist.
          grep -q "export function downloadTrack" pkg/web/hotaudio.d.ts

  # `scripts/` are Bun scripts for the signer-recovery toolchain. They are
  # self-contained and need no dependencies to parse.
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Bundle-check the recovery scripts
        run: |
          for s in scripts/*.ts; do
            bun build --no-bundle "$s" --target=bun --outfile=/dev/null
          done

  # The README's install block is generated from the same table that names the
  # release archives (`scripts/release-targets.tsv`), so a rename there cannot
  # leave the docs pointing at an archive that is never built, and nobody has to
  # remember to bump a version in the install commands by hand.
  readme:
    name: readme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the install block is current
        run: ./scripts/install-block.sh --check
