name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The installed toolchain is newer than the MSRV, so a bare `cargo`
      # invocation cannot catch accidental use of features gated after 1.87.
      # Several dependencies also declare 1.87 as their own MSRV, so this is
      # the floor for the tree, not just for this crate.
      - name: Check MSRV
        run: |
          rustup toolchain install 1.87 --profile minimal
          cargo +1.87 check --locked --all-targets
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # Catches broken intra-doc links and undocumented public items, which
      # otherwise only surface for someone reading the published docs.
      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The release ships shell completions and a man page generated by the
      # binary itself (see release.yml), so the generator is exercised here
      # rather than first at tag time. The unit tests already assert the
      # content; this only proves the shipped entry points still run.
      - name: Completions and man page
        run: |
          set -euo pipefail
          for shell in bash zsh fish powershell; do
            cargo run --locked --quiet -- --completions "$shell" > "completions.$shell"
            test -s "completions.$shell"
          done
          cargo run --locked --quiet -- --man-page > hotaudio-download.1
          test -s hotaudio-download.1
      # The decrypt path is the crate's performance claim, and the wasm
      # transport work could have pushed a copy or an await into it without any
      # test failing. The timing assertion only exists in optimised builds, and
      # its floor is calibrated for the CI runner, so it stays on the reference
      # platform rather than in the cross-platform test matrix below.
      - name: Perf guard
        run: cargo test --release --locked --test perf_guard

  # The optional desktop helper (`hotaudio-webview`) has its own dependency tree
  # (`wry`/`tao`), so the main gates above never compile it. Build and lint it
  # with the platform webview headers installed, on the one Linux target that
  # ships it.
  webview:
    name: webview helper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install webview dependencies
        run: |
          sudo scripts/ci-apt.sh \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Check MSRV
        run: |
          rustup toolchain install 1.87 --profile minimal
          cargo +1.87 check --locked --all-targets --features webview
      - name: Clippy
        run: cargo clippy --locked --all-targets --features webview -- -D warnings
      - name: Test
        run: cargo test --locked --features webview

  # Supply-chain gate over the same target set that ships (`deny.toml`):
  # advisories, license expressions, banned crates and allowed sources. Unlike
  # `cargo test` this needs network — it fetches the RustSec advisory database.
  deny:
    name: deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Prebuilt binary, so cargo-deny's own tree is not compiled here. Pinned
      # because `deny.toml` is tied to a cargo-deny schema version.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Check advisories, licenses, bans and sources
        run: cargo deny check

  # Attribution: the copyright notices and license texts of everything linked
  # into the binaries have to travel with them. The release workflow generates
  # that notice from the tag's locked graph (see release.yml); there is nothing
  # to keep in sync. This job only proves the generator still works on the
  # current tree, so a broken tool fails here rather than at release time.
  licenses:
    name: licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Not carried by `install-action`, and the release asset publishes no
      # checksum, so the digest is pinned here to make the download verifiable.
      - name: Install cargo-bundle-licenses
        run: |
          set -euo pipefail
          url=https://github.com/sstadick/cargo-bundle-licenses/releases/download/v4.2.0/cargo-bundle-licenses-linux-amd64
          bin="$HOME/.cargo/bin/cargo-bundle-licenses"
          curl -fsSL "$url" -o "$bin"
          echo "4208af8db7a34b427068211e73cdd299b577245601f68c5a1c3af85e4fa4cc7c  $bin" | sha256sum -c -
          chmod +x "$bin"
      # The tool reads license files from the crate sources, which
      # `cargo metadata` alone does not download.
      - name: Fetch crate sources
        run: cargo fetch --locked
      - name: Generate the third-party notice
        run: cargo bundle-licenses --features webview --format yaml --output "$RUNNER_TEMP/THIRD_PARTY_LICENSES.yml"
      - name: Check the notice is complete
        run: |
          set -euo pipefail
          notice="$RUNNER_TEMP/THIRD_PARTY_LICENSES.yml"
          test -s "$notice"
          # Spot-check a few crates that must be attributed, so a generator that
          # silently emits nothing cannot pass.
          for crate in ureq rustls chacha20poly1305 x25519-dalek; do
            grep -q "package_name: ${crate}$" "$notice" \
              || { echo "::error::$crate missing from the third-party notice"; exit 1; }
          done

  # The crate ships natively on Windows and macOS. `sanitize`, the
  # `--stream-to` temp-file rename and path handling differ per platform, and
  # the ubuntu-only gates above cannot see a bug that only appears there. Run
  # the offline suite on every shipped desktop target; the MSRV, fmt, clippy
  # and doc gates stay single-platform because they are host-independent.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  # The browser build is the same pipeline over the `fetch` transport, so it is
  # held to the same bar: clippy-clean, and the same tests actually executed in
  # a browser rather than merely compiled.
  wasm:
    name: wasm (browser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Same reasoning as the MSRV check above: the installed toolchain is newer
      # than the floor, so a bare `cargo` cannot catch a feature gated after 1.87.
      - name: Check MSRV
        run: |
          # The target must be added to the 1.87 toolchain specifically. The
          # `dtolnay/rust-toolchain` step above installs it for `stable`, which
          # is a separate toolchain, and `+1.87` does not inherit it.
          rustup toolchain install 1.87 --profile minimal --target wasm32-unknown-unknown
          cargo +1.87 check --locked --target wasm32-unknown-unknown --lib
      - name: Clippy
        run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
      # The runner is not on the image and `cargo install` would rebuild the
      # whole tree. The CLI version must match the `wasm-bindgen` in Cargo.lock
      # exactly: the runner rejects a test binary produced by a different one.
      # The action has no `version` input and its `@wasm-bindgen-cli` shorthand
      # installs the latest release, so the lockfile is the only pin that
      # cannot drift the day upstream ships a version the lock has not taken.
      - name: Pin wasm-bindgen to the lockfile
        id: wasm-bindgen
        run: |
          want=$(awk '/^name = "wasm-bindgen"$/{getline; print; exit}' Cargo.lock \
              | sed -n 's/^version = "\(.*\)"/\1/p')
          test -n "$want"
          echo "version=$want" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}
      # `wasm32-unknown-unknown` binaries cannot be exec'd; this runner executes
      # them through `wasm-bindgen`, which is what a page does.
      - name: Test
        run: cargo test --locked --target wasm32-unknown-unknown
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  # The other half of the crate is the browser build. This runs the exact script
  # the release uses, so a change that breaks the `pkg/` package fails here,
  # before a tag exists, rather than during one.
  wasm-pkg:
    name: wasm package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Same lockfile-derived pin as the browser job: the build script refuses a
      # CLI whose version differs from the `wasm-bindgen` in Cargo.lock.
      - name: Pin wasm-bindgen to the lockfile
        id: wasm-bindgen
        run: |
          want=$(awk '/^name = "wasm-bindgen"$/{getline; print; exit}' Cargo.lock \
              | sed -n 's/^version = "\(.*\)"/\1/p')
          test -n "$want"
          echo "version=$want" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}
      - name: Build the package
        run: ./scripts/build-wasm.sh
      - name: Check the package
        run: |
          set -euo pipefail
          for f in web/hotaudio.js web/hotaudio.d.ts web/hotaudio_bg.wasm \
                   nodejs/hotaudio.js nodejs/hotaudio.d.ts nodejs/hotaudio_bg.wasm; do
            test -s "pkg/$f" || { echo "::error::missing pkg/$f"; exit 1; }
          done
          # The generated types have to describe the exports, not merely exist.
          grep -q "export function downloadTrack" pkg/web/hotaudio.d.ts

  # `scripts/` are Bun scripts for the signer-recovery toolchain. They are
  # self-contained and need no dependencies to parse.
  scripts:
    name: scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Bundle-check the recovery scripts
        run: |
          for s in scripts/*.ts; do
            bun build --no-bundle "$s" --target=bun --outfile=/dev/null
          done
      - name: Syntax-check the shell scripts
        run: |
          for s in scripts/*.sh; do bash -n "$s"; done

  # docs/INSTALL.md's download block is generated from the same table that names
  # the release archives (`scripts/release-targets.tsv`), so a rename there cannot
  # leave the docs pointing at an archive that is never built, and nobody has to
  # remember to bump a version in the install commands by hand.
  install:
    name: install docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the install block is current
        run: ./scripts/install-block.sh --check
      # install.sh runs unread on a stranger's machine, piped into a shell, so
      # its platform mapping is pinned here: every supported pair must resolve to
      # the archive the table names, and an unknown platform must fail rather
      # than guess.
      - name: Check the installer's platform mapping
        run: |
          set -euo pipefail
          for t in \
            "Linux x86_64 linux-x86_64-static" \
            "Linux amd64 linux-x86_64-static" \
            "Linux aarch64 linux-arm64-static" \
            "Linux arm64 linux-arm64-static" \
            "Darwin x86_64 macos-x86_64" \
            "Darwin arm64 macos-arm64" \
            "Linux aarch64 android-arm64" \
            "Linux x86_64 android-x86_64"; do
            set -- $t
            os=$1 arch=$2 slug=$3 prefix=
            case "$slug" in android-*) prefix=/data/data/com.termux/files/usr ;; esac
            got=$(HOTAUDIO_OS="$os" HOTAUDIO_ARCH="$arch" PREFIX="$prefix" sh scripts/install.sh --print)
            [ "$got" = "hotaudio-download-${slug}.tar.gz" ] \
              || { echo "::error::$os/$arch resolved to '$got', expected 'hotaudio-download-${slug}.tar.gz'"; exit 1; }
            # The slug it picked must be one the release actually builds.
            awk -F'\t' -v want="$slug" '$2 == want { found = 1 } END { exit !found }' scripts/release-targets.tsv \
              || { echo "::error::the installer maps $os/$arch to '$slug', which is not in release-targets.tsv"; exit 1; }
          done
          if HOTAUDIO_OS=MINGW64_NT-10.0 HOTAUDIO_ARCH=x86_64 sh scripts/install.sh --print >/dev/null 2>&1; then
            echo "::error::the installer claimed to support an unknown platform"; exit 1
          fi
          # Completions are opt-out and shell-specific. The flags the docs
          # promise must parse, and an unsupported shell must be refused rather
          # than silently installing nothing.
          sh scripts/install.sh --no-completions --print >/dev/null
          sh scripts/install.sh --completions fish --print >/dev/null
          HOTAUDIO_SHELL=zsh sh scripts/install.sh --completions=zsh --print >/dev/null
          if sh scripts/install.sh --completions=tcsh --print >/dev/null 2>&1; then
            echo "::error::the installer accepted an unsupported completion shell"; exit 1
          fi
          help=$(sh scripts/install.sh --help)
          case "$help" in
            *--no-completions*) ;;
            *)
              echo "::error::install.sh --help does not document --no-completions"
              exit 1
              ;;
          esac
          sh -n scripts/install.sh
      # Windows has no shell script to parse, so the README spells its download
      # out by hand. Pin that too: every archive the README names must be one the
      # table builds.
      - name: Check the README names real archives
        run: |
          set -euo pipefail
          slugs=$(awk -F'\t' '!/^#/ && NF { print $2 }' scripts/release-targets.tsv)
          for name in $(grep -ohE 'hotaudio-download-[a-z0-9_.-]+\.(tar\.gz|zip)' README.md | sort -u); do
            slug=${name#hotaudio-download-}
            slug=${slug%.tar.gz}
            slug=${slug%.zip}
            printf '%s\n' "$slugs" | grep -qx "$slug" \
              || { echo "::error::README names $name, which is not in release-targets.tsv"; exit 1; }
          done
          echo "README archive names are current"

  plan:
    name: plan targets
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(jq -R -s -c '
            split("\n")
            | map(select(length > 0 and (startswith("#") | not)))
            | map(split("\t"))
            | {include: map({
                target: .[0], slug: .[1], os: .[2],
                native: (.[3] == "true"),
                label: .[4], featured: (.[5] == "true"),
                webview: (.[6] == "true")
              })}
          ' scripts/release-targets.tsv)
          echo "$matrix"
          test "$(echo "$matrix" | jq '.include | length')" -gt 0
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.slug }}
    needs: plan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo scripts/ci-apt.sh musl-tools

      # The helper links the platform webview. Only the desktop targets in
      # `release-targets.tsv` mark `webview` true; musl, MinGW and Android have
      # no toolkit the release runner can build.
      - name: Install webview dependencies
        if: matrix.webview && runner.os == 'Linux'
        run: |
          sudo scripts/ci-apt.sh \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Verify mingw-w64
        if: contains(matrix.target, 'windows-gnu')
        shell: pwsh
        run: |
          if (-not (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue)) {
            Write-Error "x86_64-w64-mingw32-gcc not found on this runner"
            exit 1
          }

      - uses: nttld/setup-ndk@v1
        if: endsWith(matrix.target, '-android')
        id: ndk
        with:
          ndk-version: r27d
          add-to-path: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"

          case "$target" in
            x86_64-*)
              case "$target" in
                *-windows-msvc) ;;
                *) export CFLAGS="${CFLAGS:-} -march=x86-64 -mtune=generic" ;;
              esac
              ;;
          esac

          case "$target" in
            *-linux-android)
              bin="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
              case "$target" in
                aarch64-linux-android)   abi=aarch64-linux-android ;;
                x86_64-linux-android)    abi=x86_64-linux-android ;;
                armv7-linux-androideabi) abi=armv7a-linux-androideabi ;;
                *) echo "::error::unhandled android target $target"; exit 1 ;;
              esac

              clang="$bin/${abi}24-clang"
              if [ ! -x "$clang" ]; then
                echo "::error::NDK clang wrapper missing: $clang"
                ls "$bin" | head -20 || true
                exit 1
              fi

              ln -sf "$clang" "$bin/${abi}-clang"
              ln -sf "$bin/${abi}24-clang++" "$bin/${abi}-clang++"
              export PATH="$bin:$PATH"

              var=$(printf '%s' "$target" | tr 'a-z-' 'A-Z_')
              export "CARGO_TARGET_${var}_LINKER=$clang"
              export "CARGO_TARGET_${var}_AR=$bin/llvm-ar"
              export "CC_${var}=$clang"
              export "AR_${var}=$bin/llvm-ar"
              ;;
          esac

          features=()
          if [ "${{ matrix.webview }}" = "true" ]; then
            features=(--features webview)
          fi
          cargo build --release --locked --target "$target" "${features[@]}"

      - name: Inspect artifact
        if: ${{ !matrix.native && runner.os != 'Windows' }}
        shell: bash
        run: file "target/${{ matrix.target }}/release/hotaudio-download"

      - name: Smoke test
        if: matrix.native
        shell: bash
        run: |
          set -euo pipefail
          exe="target/${{ matrix.target }}/release/hotaudio-download${{ runner.os == 'Windows' && '.exe' || '' }}"
          "$exe" --help | head -3
          "$exe" --help | grep -q -- "--stream-to"
          if "$exe" --definitely-not-a-flag >/dev/null 2>&1; then
            echo "::error::unknown flag was accepted"
            exit 1
          fi

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="hotaudio-download-${{ matrix.slug }}"
          mkdir -p "$stage" dist
          cp "target/${{ matrix.target }}/release/hotaudio-download" "$stage/"
          if [ "${{ matrix.webview }}" = "true" ]; then
            cp "target/${{ matrix.target }}/release/hotaudio-webview" "$stage/"
          fi
          cp README.md LICENSE CHANGELOG.md "$stage/"
          tar -czf "dist/${stage}.tar.gz" "$stage"
          rm -rf "$stage"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "hotaudio-download-${{ matrix.slug }}"
          $exe = "target/${{ matrix.target }}/release/hotaudio-download.exe"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item $exe $stage
          if ("${{ matrix.webview }}" -eq "true") {
            Copy-Item "target/${{ matrix.target }}/release/hotaudio-webview.exe" $stage
          }
          Copy-Item README.md, LICENSE, CHANGELOG.md $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$stage.zip"
          Remove-Item -Recurse -Force $stage

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.slug }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
