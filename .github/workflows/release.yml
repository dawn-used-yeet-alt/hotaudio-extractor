name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build from (e.g. v1.0.0). Must already exist."
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A published release is immutable, so the tag must already exist and must
  # agree exactly with the version in Cargo.toml.
  check:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$tag crate_version=$crate"
          if [ "$tag" != "v${crate}" ]; then
            echo "::error::tag '$tag' does not match Cargo.toml version 'v${crate}'"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux, glibc ---
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            native: true
          # Built on a native ARM runner rather than cross-compiled: the arm64
          # apt suites 404 on the amd64 runners, and a native build is
          # smoke-testable.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            native: true
          # --- Linux, musl: statically linked, for containers and minimal hosts ---
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            native: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            native: true
          # --- macOS ---
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
          # --- Windows ---
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            native: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            native: false
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            native: false

    steps:
      # Always build the tagged source, never the current default branch: a
      # manual re-run of an existing tag must reproduce that tag's binaries.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}

      # rustc ships a self-contained musl linker for x86_64; the aarch64 musl
      # target needs a cross gcc on an amd64 host, which we avoid by building
      # natively. musl-tools is still required on both for the target libc.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools

      # mingw-w64 is preinstalled on the Windows runners, but make it explicit
      # so the gnu target cannot fail on a runner-image change.
      - name: Verify mingw-w64
        if: contains(matrix.target, 'windows-gnu')
        shell: pwsh
        run: |
          if (-not (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue)) {
            Write-Error "x86_64-w64-mingw32-gcc not found on this runner"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Only runner-native targets can be executed; the cross-compiled ones are
      # covered by the native builds of the same codebase.
      - name: Smoke test
        if: matrix.native
        shell: bash
        run: |
          set -euo pipefail
          exe="target/${{ matrix.target }}/release/hotaudio-download${{ runner.os == 'Windows' && '.exe' || '' }}"
          "$exe" --help | head -3
          "$exe" --help | grep -q -- "--stream-to"
          # An unknown flag must fail loudly rather than be silently ignored.
          if "$exe" --definitely-not-a-flag >/dev/null 2>&1; then
            echo "::error::unknown flag was accepted"
            exit 1
          fi

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"
          stage="hotaudio-download-${tag}-${{ matrix.target }}"
          mkdir -p "$stage" dist
          cp "target/${{ matrix.target }}/release/hotaudio-download" "$stage/"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          # Note the libc in the filename: the musl build is not interchangeable
          # with the gnu one, and both are published under this target triple.
          tar -czf "dist/${stage}.tar.gz" "$stage"
          rm -rf "$stage"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ needs.check.outputs.tag }}'
          $stage = "hotaudio-download-$tag-${{ matrix.target }}"
          $exe = "target/${{ matrix.target }}/release/hotaudio-download.exe"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item $exe $stage
          Copy-Item README.md, LICENSE, CHANGELOG.md $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$stage.zip"
          Remove-Item -Recurse -Force $stage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One place for checksums, so the .sha256 files cover every archive and
      # no per-platform shell differences can skew them.
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          body_path: release-notes.md
          prerelease: ${{ contains(needs.check.outputs.tag, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
