name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build from (e.g. v1.0.0). Must already exist."
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A published release is immutable, so the tag must already exist and must
  # agree exactly with the version in Cargo.toml.
  check:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$tag crate_version=$crate"
          if [ "$tag" != "v${crate}" ]; then
            echo "::error::tag '$tag' does not match Cargo.toml version 'v${crate}'"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  # Attribution: the copyright notices and license texts of everything linked
  # into the binaries have to travel with them. The notice is derived from the
  # locked dependency graph, so it is built here from the tag's `Cargo.lock` and
  # shipped in every archive rather than committed: it cannot drift from the
  # binaries, and the repository stays free of a generated megabyte of
  # duplicated license text.
  notices:
    name: third-party notices
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      # Not carried by `install-action`, and the release asset publishes no
      # checksum, so the digest is pinned here to make the download verifiable.
      - name: Install cargo-bundle-licenses
        run: |
          set -euo pipefail
          url=https://github.com/sstadick/cargo-bundle-licenses/releases/download/v4.2.0/cargo-bundle-licenses-linux-amd64
          bin="$HOME/.cargo/bin/cargo-bundle-licenses"
          curl -fsSL "$url" -o "$bin"
          echo "4208af8db7a34b427068211e73cdd299b577245601f68c5a1c3af85e4fa4cc7c  $bin" | sha256sum -c -
          chmod +x "$bin"
      # The tool reads license files from the crate sources, which
      # `cargo metadata` alone does not download.
      - name: Fetch crate sources
        run: cargo fetch --locked
      - name: Generate
        run: cargo bundle-licenses --format yaml --output THIRD_PARTY_LICENSES.yml
      - uses: actions/upload-artifact@v4
        with:
          name: notices
          path: THIRD_PARTY_LICENSES.yml
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: [check, notices]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux, glibc ---
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            native: true
          # Built on a native ARM runner rather than cross-compiled: the arm64
          # apt suites 404 on the amd64 runners, and a native build is
          # smoke-testable.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            native: true
          # --- Linux, musl: statically linked, for containers and minimal hosts ---
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            native: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            native: true
          # --- macOS ---
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
          # --- Windows ---
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            native: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            native: false
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            native: false
          # --- Android / Termux ---
          # Tier 2 targets: prebuilt std exists, so only the NDK is needed.
          # These link against bionic, which is what Termux runs on.
          - target: aarch64-linux-android
            os: ubuntu-latest
            native: false
          - target: x86_64-linux-android
            os: ubuntu-latest
            native: false

    steps:
      # Always build the tagged source, never the current default branch: a
      # manual re-run of an existing tag must reproduce that tag's binaries.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      # Generated once by the `notices` job above, so every archive carries the
      # same notice without rebuilding it per target.
      - name: Fetch third-party notices
        uses: actions/download-artifact@v4
        with:
          name: notices

      # rustc ships a self-contained musl linker for x86_64; the aarch64 musl
      # target needs a cross gcc on an amd64 host, which we avoid by building
      # natively. musl-tools is still required on both for the target libc.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools

      # mingw-w64 is preinstalled on the Windows runners, but make it explicit
      # so the gnu target cannot fail on a runner-image change.
      - name: Verify mingw-w64
        if: contains(matrix.target, 'windows-gnu')
        shell: pwsh
        run: |
          if (-not (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue)) {
            Write-Error "x86_64-w64-mingw32-gcc not found on this runner"
            exit 1
          }

      # Android needs the NDK for its linker, sysroot and C compiler; nothing
      # else does. `ring` (via rustls) builds C, so a working cc is required.
      - uses: nttld/setup-ndk@v1
        if: endsWith(matrix.target, '-android')
        id: ndk
        with:
          ndk-version: r27d
          add-to-path: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"

          case "$target" in
            *-linux-android)
              bin="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
              case "$target" in
                aarch64-linux-android)   abi=aarch64-linux-android ;;
                x86_64-linux-android)    abi=x86_64-linux-android ;;
                armv7-linux-androideabi) abi=armv7a-linux-androideabi ;;
                *) echo "::error::unhandled android target $target"; exit 1 ;;
              esac

              # API 24 is Termux's own minimum, so these run everywhere Termux does.
              clang="$bin/${abi}24-clang"
              if [ ! -x "$clang" ]; then
                echo "::error::NDK clang wrapper missing: $clang"
                ls "$bin" | head -20 || true
                exit 1
              fi

              # The NDK names its wrappers per API level, but both cargo and
              # cc-rs look up the bare ABI name (aarch64-linux-android-clang).
              ln -sf "$clang" "$bin/${abi}-clang"
              ln -sf "$bin/${abi}24-clang++" "$bin/${abi}-clang++"
              export PATH="$bin:$PATH"

              # Cargo and cc spell target variables as the triple, uppercased.
              var=$(printf '%s' "$target" | tr 'a-z-' 'A-Z_')
              export "CARGO_TARGET_${var}_LINKER=$clang"
              export "CARGO_TARGET_${var}_AR=$bin/llvm-ar"
              export "CC_${var}=$clang"
              export "AR_${var}=$bin/llvm-ar"
              ;;
          esac

          cargo build --release --locked --target "$target"

      # Cross-built targets cannot run here, so confirm the artifact is the
      # architecture and format it claims to be.
      - name: Inspect artifact
        if: ${{ !matrix.native && runner.os != 'Windows' }}
        shell: bash
        run: file "target/${{ matrix.target }}/release/hotaudio-download"

      # Only runner-native targets can be executed; the cross-compiled ones are
      # covered by the native builds of the same codebase.
      - name: Smoke test
        if: matrix.native
        shell: bash
        run: |
          set -euo pipefail
          exe="target/${{ matrix.target }}/release/hotaudio-download${{ runner.os == 'Windows' && '.exe' || '' }}"
          "$exe" --help | head -3
          "$exe" --help | grep -q -- "--stream-to"
          # An unknown flag must fail loudly rather than be silently ignored.
          if "$exe" --definitely-not-a-flag >/dev/null 2>&1; then
            echo "::error::unknown flag was accepted"
            exit 1
          fi

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"
          stage="hotaudio-download-${tag}-${{ matrix.target }}"
          mkdir -p "$stage" dist
          cp "target/${{ matrix.target }}/release/hotaudio-download" "$stage/"
          cp README.md LICENSE CHANGELOG.md THIRD_PARTY_LICENSES.yml "$stage/"
          # Note the libc in the filename: the musl build is not interchangeable
          # with the gnu one, and both are published under this target triple.
          tar -czf "dist/${stage}.tar.gz" "$stage"
          rm -rf "$stage"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ needs.check.outputs.tag }}'
          $stage = "hotaudio-download-$tag-${{ matrix.target }}"
          $exe = "target/${{ matrix.target }}/release/hotaudio-download.exe"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item $exe $stage
          Copy-Item README.md, LICENSE, CHANGELOG.md, THIRD_PARTY_LICENSES.yml $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$stage.zip"
          Remove-Item -Recurse -Force $stage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The crate also ships as a browser module. There is one wasm32 artifact rather
  # than a per-platform matrix, and it is produced by the same script CI runs, so
  # the published package and the tested one are the same build.
  wasm:
    name: wasm package
    needs: [check, notices]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Fetch third-party notices
        uses: actions/download-artifact@v4
        with:
          name: notices

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-pkg

      # No explicit version: the action installs the `wasm-bindgen` from
      # Cargo.lock, which is what the build script checks the CLI against.
      - uses: taiki-e/install-action@wasm-bindgen-cli

      - name: Build the package
        run: ./scripts/build-wasm.sh pkg

      - name: Package (tar.gz)
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"
          stage="hotaudio-wasm-${tag}"
          mkdir -p "dist/$stage"
          cp -r pkg/web pkg/nodejs "dist/$stage/"
          cp README.md LICENSE CHANGELOG.md THIRD_PARTY_LICENSES.yml "dist/$stage/"
          tar -czf "dist/${stage}.tar.gz" -C dist "$stage"
          rm -rf "dist/$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/*.tar.gz
          if-no-files-found: error

  # Shell completions and a man page are platform-independent, and generating
  # them needs a binary that can run, so they are produced once here rather than
  # in the per-target matrix (part of which is cross-compiled and cannot exec).
  # Both are printed by the released binary itself, so there is nothing to keep
  # in sync.
  completions:
    name: completions and man page
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: completions

      - name: Generate
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"
          stage="hotaudio-completions-${tag}"
          mkdir -p "dist/$stage/completions" "dist/$stage/man"
          cargo build --release --locked
          exe=target/release/hotaudio-download
          for shell in bash zsh fish powershell; do
            "$exe" --completions "$shell" > "dist/$stage/completions/hotaudio-download.$shell"
          done
          "$exe" --man-page > "dist/$stage/man/hotaudio-download.1"
          cp README.md LICENSE CHANGELOG.md "dist/$stage/"
          tar -czf "dist/${stage}.tar.gz" -C dist "$stage"
          rm -rf "dist/$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: completions
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: [check, build, wasm, completions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One place for checksums, so the .sha256 files cover every archive and
      # no per-platform shell differences can skew them.
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          body_path: release-notes.md
          prerelease: ${{ contains(needs.check.outputs.tag, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
